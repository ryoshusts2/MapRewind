name: Build MapRewind

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x' # 注意这里是 9.0.x，因为项目是 net9.0

    - name: Build
      run: dotnet build MapRewind.csproj -c Release /p:Sts2DataDir="./"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MapRewind-dll
        path: bin/Release/net9.0/MapRewind.dll